name: Publish BHA jobs feed

# Runs the publish script every hour and whenever you click "Run workflow".
# It regenerates jobs.json from Airtable and commits it only if something changed.

on:
  schedule:
    - cron: "0 * * * *"      # hourly, on the hour (UTC). GitHub may delay a few minutes.
  workflow_dispatch: {}       # adds a manual "Run workflow" button in the Actions tab

permissions:
  contents: write             # lets the action commit the updated jobs.json

concurrency:                  # never run two publishes at once
  group: publish-jobs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate jobs.json from Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python3 bha-jobs-publish.py

      - name: Commit the feed if it changed
        run: |
          git config user.name  "BHA jobs bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- jobs.json; then
            echo "No change to jobs.json — nothing to commit."
          else
            git add jobs.json
            git commit -m "Update jobs feed ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi

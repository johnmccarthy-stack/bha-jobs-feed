name: Publish BHA jobs feed

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-jobs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate jobs.json from Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python3 bha-jobs-publish.py

      - name: Commit the feed if it changed
        run: |
          git config user.name  "BHA jobs bot"
          git config user.email "actions@users.noreply.github.com"
          git add jobs.json
          if git diff --cached --quiet; then
            echo "No change to jobs.json — nothing to commit."
          else
            git commit -m "Update jobs feed ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
